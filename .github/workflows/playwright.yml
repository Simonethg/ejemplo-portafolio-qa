# Smoke de Playwright en GitHub Actions.
# Corre solo con push, pull request o a mano (botón "Run workflow"). Nada programado.
# Liviano: un solo navegador (Chromium) para gastar pocos minutos.
name: Playwright Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Correr los tests
        run: npx playwright test
      - name: Guardar el reporte HTML
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
